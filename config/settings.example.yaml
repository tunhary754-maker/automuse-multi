# Copy thành config/settings.yaml rồi chỉnh theo ý bạn.
# (File settings.yaml thật được gitignore, không commit.)

muse:
  base_url: "https://muse.ai"
  # Transport gọi Muse: "rest" (REST cũ, đã biết sai: 403) hoặc "gateway"
  # (Noise WebSocket thật — xem docs/gateway-protocol.md). Mặc định
  # "gateway" từ 2026-10-26 (vòng lặp đã khép kín live).
  transport: "gateway"
  # API web của Muse không công khai — nếu Muse đổi API, sửa các path dưới
  # đây cho khớp với request thật quan sát được ở DevTools (muse.ai -> Network).
  # Login check: GET thẳng trang chủ (phụ: /api/me), không dùng /api/auth/session
  # vì endpoint đó trả 401 ngay cả với cookie còn sống.
  # Quota/token: API không công khai — check_quota() thử các path ứng viên
  # dưới đây, đọc được thì báo số dư, không thì báo không rõ.
  quota_check_paths:
    - "/api/user/usage"
    - "/api/usage"
    - "/api/credits"
    - "/api/user/credits"
    - "/api/quota"
    - "/api/user/quota"
    - "/api/balance"
    - "/api/subscription"
  generate_video_path: "/api/media/generate/video"
  generate_image_path: "/api/media/generate/image"
  job_status_path: "/api/media/jobs/{job_id}"
  timeout: 120
  poll_interval: 5
  poll_timeout: 900

generation:
  default_aspect: "16:9"
  default_duration: 5
  default_fps: 30
  delay_between_jobs: 2
  max_retries_per_scene: 3

# Giới hạn tuần (tuần lịch, thứ Hai 00:00 -> thứ Hai tuần sau).
# 0 = không giới hạn. Mỗi acc có thể ghi đè riêng bằng:
#   python cli.py accounts set-limit --name acc1 --videos 30 --minutes 180
limits:
  weekly_max_videos: 20
  weekly_max_minutes: 120

elevenlabs:
  model: "eleven_multilingual_v2"   # đọc tốt tiếng Việt
  default_voice: "narrator"
  stability: 0.5
  similarity_boost: 0.75

video:
  width_16_9: 1280
  height_16_9: 720
  width_9_16: 720
  height_9_16: 1280
  fps: 30
  crf: 20
  preset: "medium"
  iris_out_seconds: 1.0
  fade_out_seconds: 1.0
  narration_gap_seconds: 0.3
