# Copy thành config/settings.yaml rồi chỉnh theo ý bạn.
# (File settings.yaml thật được gitignore, không commit.)

muse:
  base_url: "https://muse.ai"
  # API web của Muse không công khai — nếu Muse đổi API, sửa các path dưới
  # đây cho khớp với request thật quan sát được ở DevTools (muse.ai -> Network).
  login_check_path: "/api/auth/session"
  generate_video_path: "/api/media/generate/video"
  generate_image_path: "/api/media/generate/image"
  job_status_path: "/api/media/jobs/{job_id}"
  timeout: 120
  poll_interval: 5
  poll_timeout: 900

generation:
  default_aspect: "16:9"
  default_duration: 5
  default_fps: 30
  delay_between_jobs: 2
  max_retries_per_scene: 3

elevenlabs:
  model: "eleven_multilingual_v2"   # đọc tốt tiếng Việt
  default_voice: "narrator"
  stability: 0.5
  similarity_boost: 0.75

video:
  width_16_9: 1280
  height_16_9: 720
  width_9_16: 720
  height_9_16: 1280
  fps: 30
  crf: 20
  preset: "medium"
  iris_out_seconds: 1.0
  fade_out_seconds: 1.0
  narration_gap_seconds: 0.3
