# Thế giới động vật — "Vua của thảo nguyên" (10 cảnh x 10s = ~100s)
# Tập demo theo skill wildlife-documentary: 1 loài chủ chốt (sư tử cái),
# mỗi cảnh 1 cơ chế sinh tồn + 1 loài + 1 con số; mở đầu tương phản +
# số liệu, kết bằng câu luận điểm đảo ngược trực giác.
# Lời dẫn: Bá Lục, tốc độ 0.9 (chậm, rõ) — theo skill.
# Chạy: python cli.py build --script scripts/the-gioi-dong-vat-100s.yaml --accounts acc1 --no-tts
# (lồng tiếng riêng sau bằng ~/workspace/dub_demo.py, tốc độ 0.9)
title: "Thế giới động vật — Vua của thảo nguyên (100s)"
kind: documentary
aspect: "16:9"
fps: 30
default_voice: narrator
voices:
  narrator: "KJmTHSk3TjHp87WObL98"   # Bá Lục — nam miền Bắc, Vietnamese Narrator
music: ""

scenes:
  - id: s01
    title: "Mùa khô"
    duration: 10
    visual: "Cinematic aerial shot of dry African savanna at golden dawn, cracked earth, acacia trees silhouetted, a lion pride walking in distance, National Geographic documentary style"
    narration: "Thảo nguyên châu Phi, mùa khô. 40 độ C, sáu tháng không mưa. Vậy mà sư tử cái vẫn nuôi sống cả đàn."
    voice: narrator

  - id: s02
    title: "Sư tử cái rình mồi"
    duration: 10
    visual: "Slow motion lioness stalking through tall golden grass, intense amber eyes, dust floating in warm sunlight, wildlife documentary cinematography"
    narration: "Sư tử cái rình mồi. Nàng nằm im ba giờ đồng hồ, chỉ chờ một khoảnh khắc."
    voice: narrator

  - id: s03
    title: "Đàn linh dương"
    duration: 10
    visual: "Wide shot of a herd of antelopes grazing on the savanna, ears twitching, alert, golden hour light, BBC Earth style"
    narration: "Đàn linh dương hai trăm con. Mỗi con chạy 80 km một giờ. Chỉ một con chậm lại là đủ."
    voice: narrator

  - id: s04
    title: "Cuộc rượt đuổi"
    duration: 10
    visual: "High speed chase across the savanna, lioness sprinting after an antelope, dust clouds, dynamic camera tracking, dramatic wildlife action"
    narration: "Cuộc rượt đuổi chỉ kéo dài 30 giây. Sư tử cái tăng tốc tới 60 km một giờ."
    voice: narrator

  - id: s05
    title: "Cả đàn cùng săn"
    duration: 10
    visual: "A pride of lions surrounding an antelope from three directions on the savanna, coordinated ambush, tense, wildlife documentary cinematography"
    narration: "Sư tử không săn một mình. Cả đàn 12 con vây con mồi từ ba hướng."
    voice: narrator

  - id: s06
    title: "Nghỉ ngơi sau chuyến săn"
    duration: 10
    visual: "Lion pride resting together in the shade of an acacia tree after the hunt, lioness gently grooming her cub, cubs sleeping beside adults, warm afternoon light, peaceful wildlife documentary cinematography"
    narration: "Sau chuyến săn, cả đàn nằm nghỉ dưới bóng cây. Sư tử ngủ tới 20 giờ một ngày để hồi sức."
    voice: narrator

  - id: s07
    title: "Sư tử con"
    duration: 10
    visual: "Lion cubs play-fighting and practicing hunting in golden grass, clumsy and curious, soft warm light, wildlife documentary cinematography"
    narration: "Sư tử con học săn từ tháng thứ sáu. Chỉ một nửa sống tới hai tuổi."
    voice: narrator

  - id: s08
    title: "Vua sư tử"
    duration: 10
    visual: "Majestic male lion with dark mane standing on a rocky outcrop at sunset, roaring, wind blowing mane, epic low angle shot, golden light"
    narration: "Sư tử đực không săn. Nó bảo vệ lãnh thổ rộng 100 km vuông."
    voice: narrator

  - id: s09
    title: "Đêm thảo nguyên"
    duration: 10
    visual: "Lion pride resting close together under an acacia tree at night, stars above, cool blue moonlight, peaceful and quiet, wildlife documentary cinematography"
    narration: "Đêm xuống, nhiệt độ rơi còn 15 độ. Cả đàn nằm sát nhau để giữ ấm."
    voice: narrator

  - id: s10
    title: "Kẻ biết chờ đợi"
    duration: 10
    visual: "Lioness with cubs at golden sunset on the savanna, acacia tree silhouette, peaceful epic wide shot, warm orange sky, National Geographic documentary style"
    narration: "Ở thảo nguyên, kẻ mạnh nhất không phải là kẻ săn giỏi nhất. Mà là kẻ biết chờ đợi — và biết săn cùng nhau."
    voice: narrator
