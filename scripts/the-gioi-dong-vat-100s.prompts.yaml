    Aerial shot, wildlife documentary cinematography, BBC Earth style, 16:9 aspect
    ratio, silent, no dialogue.
  narration: Đêm xuống, nhiệt độ rơi còn 15 độ. Cả đàn nằm sát nhau để giữ ấm.
  voice: narrator
- title: Kẻ biết chờ đợi
  duration: 10
  visual: Lioness with cubs at golden sunset on the savanna, acacia tree silhouette,
