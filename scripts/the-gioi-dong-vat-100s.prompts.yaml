    wildlife documentary cinematography, BBC Earth style, 16:9 aspect ratio, silent,
    no dialogue.
  narration: Sư tử đực không săn. Nó bảo vệ lãnh thổ rộng 100 km vuông.
  voice: narrator
- title: Đêm thảo nguyên
  duration: 10
  visual: Lion pride resting close together under an acacia tree at night, stars above,
