    no dialogue.
  narration: Sư tử cái rình mồi. Nàng nằm im ba giờ đồng hồ, chỉ chờ một khoảnh khắc.
  voice: narrator
- title: Đàn linh dương
  duration: 10
  visual: Wide shot of a herd of antelopes grazing on the savanna, ears twitching,
