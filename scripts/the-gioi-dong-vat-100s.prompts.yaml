    documentary cinematography, BBC Earth style, 16:9 aspect ratio, silent, no dialogue.
  narration: Sư tử con học săn từ tháng thứ sáu. Chỉ một nửa sống tới hai tuổi.
  voice: narrator
- title: Vua sư tử
  duration: 10
  visual: Majestic male lion with dark mane standing on a rocky outcrop at sunset,
