    Slow motion close-up, wildlife documentary cinematography, BBC Earth style, 16:9
    aspect ratio, silent, no dialogue.
  narration: Ở thảo nguyên, kẻ mạnh nhất không phải là kẻ săn giỏi nhất. Mà là kẻ
    biết chờ đợi — và biết săn cùng nhau.
  voice: narrator
