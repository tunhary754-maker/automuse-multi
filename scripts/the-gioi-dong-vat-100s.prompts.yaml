    BBC Earth style, 16:9 aspect ratio, silent, no dialogue.
  narration: Thảo nguyên châu Phi, mùa khô. 40 độ C, sáu tháng không mưa. Vậy mà sư
    tử cái vẫn nuôi sống cả đàn.
  voice: narrator
- title: Sư tử cái rình mồi
  duration: 10
  visual: Slow motion lioness stalking through tall golden grass, intense amber eyes,
