# Thế giới động vật — "Kẻ sống sót trên băng" (10 cảnh x 10s = ~100s)
# Tập 2 theo skill wildlife-documentary: 1 loài chủ chốt (gấu Bắc Cực),
# mỗi cảnh 1 cơ chế sinh tồn + 1 loài + 1 con số; mở đầu tương phản +
# số liệu, kết bằng câu luận điểm đảo ngược trực giác:
# cái lạnh không phải kẻ thù, mà là nhà.
# Lời dẫn: Bá Lục, tốc độ 1.0 — theo skill (tập 1 chốt ở 1.0 sau khi nghe thử).
# Lời dẫn giữ ≤ ~20 từ/cảnh để vừa khung 10s; tập 1 đo thực tế s01 23 từ / s10 25 từ vẫn vừa (~7s), không bị tăng tốc.
# Chạy được ngay trong tuần này — giới hạn acc1 đã nâng lên 40 video/tuần, kiểm tra `accounts usage` trước khi build (tập này cần 10 video):
#   python cli.py build --script scripts/the-gioi-dong-vat-gau-bac-cuc.prompts.yaml
# Thử pipeline không tốn quota: thêm --mock
title: "Thế giới động vật — Kẻ sống sót trên băng (100s)"
kind: documentary
aspect: "16:9"
fps: 30
default_voice: narrator
voices:
  narrator: "KJmTHSk3TjHp87WObL98"   # Bá Lục — nam miền Bắc, Vietnamese Narrator
music: ""

scenes:
  - id: s01
    title: "Băng giá"
    duration: 10
    visual: "Cinematic aerial shot of vast Arctic sea ice at dawn, endless white ice floes, deep blue cracks, a polar bear walking alone in distance, National Geographic documentary style"
    narration: "Bắc Cực, mùa đông. Âm 40 độ C, mặt trời biến mất nhiều tháng. Vậy mà gấu Bắc Cực vẫn đi săn."
    voice: narrator

  - id: s02
    title: "Đôi chân tuyết"
    duration: 10
    visual: "Close-up of huge polar bear paws walking on thin sea ice, wide furry feet spreading weight, snow sparkling, wildlife documentary cinematography"
    narration: "Bàn chân gấu rộng tới 30 phân. Như đôi giày tuyết, giúp nó đi trên băng mỏng mà không vỡ."
    voice: narrator

  - id: s03
    title: "Mũi thính"
    duration: 10
    visual: "Slow motion close-up of polar bear nose sniffing the wind, frost on fur, intense dark eyes, cold Arctic light, wildlife documentary cinematography"
    narration: "Gấu ngửi thấy hải cẩu cách một cây số, xuyên qua lớp băng dày một mét."
    voice: narrator

  - id: s04
    title: "Kẻ chờ đợi"
    duration: 10
    visual: "Wide shot of a polar bear lying motionless beside a small breathing hole in the ice, patient, silent, pale blue Arctic light, BBC Earth style"
    narration: "Nó nằm im bên lỗ thở, chờ ba giờ liền. Chỉ cần một tiếng động nhỏ là đủ."
    voice: narrator

  - id: s05
    title: "Một cú vồ"
    duration: 10
    visual: "High speed action shot of a polar bear lunging at a seal breathing hole, snow exploding, powerful paws, dramatic wildlife action, dynamic camera tracking"
    narration: "Một cú vồ duy nhất. Con hải cẩu nặng 50 cân không kịp trở tay."
    voice: narrator

  - id: s06
    title: "Áo ấm"
    duration: 10
    visual: "Close-up of polar bear thick white fur and fat layer in freezing wind, frost crystals on fur, warm sunlight on ice, wildlife documentary cinematography"
    narration: "Lớp mỡ dày 10 phân, lông rỗng giữ hơi ấm. Gấu không mặc áo — gấu chính là áo ấm."
    voice: narrator

  - id: s07
    title: "Kẻ bơi"
    duration: 10
    visual: "Underwater shot of a polar bear swimming powerfully through icy blue water between ice floes, strong strokes, bubbles, epic wildlife cinematography"
    narration: "Gấu bơi liền 100 cây số giữa biển băng, không cần nghỉ. Nước lạnh không làm nó chậm lại."
    voice: narrator

  - id: s08
    title: "Gấu con"
    duration: 10
    visual: "Intimate shot inside a snow den, polar bear mother nursing two tiny cubs, warm and dark, soft light through snow, tender wildlife documentary cinematography"
    narration: "Gấu con sinh ra chỉ nặng 600 gam, bằng một quả táo. Mẹ nó nhịn ăn để nuôi con."
    voice: narrator

  - id: s09
    title: "Mùa đói"
    duration: 10
    visual: "Wide shot of a thin polar bear walking across melting summer ice, open dark water, lonely, warm low sun, melancholic wildlife documentary cinematography"
    narration: "Hè về, băng tan. Gấu nhịn ăn bốn tháng liền, sống nhờ lớp mỡ dự trữ."
    voice: narrator

  - id: s10
    title: "Nhà băng"
    duration: 10
    visual: "Majestic polar bear standing on an ice ridge at golden sunset, vast frozen ocean behind, epic low angle shot, warm orange sky, National Geographic documentary style"
    narration: "Ở Bắc Cực, kẻ sống sót không chống lại cái lạnh. Mà biến cái lạnh thành nhà của mình."
    voice: narrator
