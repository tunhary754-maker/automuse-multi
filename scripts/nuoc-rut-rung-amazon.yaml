title: Nước Rút Rừng Amazon
created_at: '2026-10-30T19:50:17.283883+00:00'
topic: Rừng Amazon
kind: documentary
aspect: '16:9'
default_voice: narrator
fps: 30
scenes:
- id: s01
  title: Nước bắt đầu rút xuống
  duration: 10
  visual: Floodwater slowly recedes from the forest floor, exposing mudbanks and stranded
    seeds beneath the trees.
  narration: Nước bắt đầu rút xuống, hạt nằm lại trên bùn mới chờ mùa sau. Điều gì
    khép lũ, quả và khô thành một vòng phụ thuộc?
- id: s02
  title: Hạt nằm lại trên bùn mới
  duration: 10
  visual: Seeds lie stranded on fresh mudbanks as floodwater retreats, some already
    sprouting in the wet silt.
  narration: Trên bùn mới bồi, hạt nằm lại chờ mùa sau, nơi nước rút để lại đất cho
    cây non.
- id: s03
  title: Cá rút về kênh theo lũ
  duration: 10
  visual: Fish swim back through narrowing channels from the flooded forest toward
    the main river.
  narration: Sông có khoảng 1.100 nhánh, cá theo lũ rút khỏi rừng ngập, trở về kênh
    sâu trú ẩn.
- id: s04
  title: Kênh sâu cho cá trú ẩn
  duration: 10
  visual: Fish gather in a deep river channel as shallow floodplain waters drain away
    around them.
  narration: Sông hạ lưu sâu trung bình 20 đến 50 m, kênh sâu giữ cá qua mùa nước
    thấp.
- id: s05
  title: Tambaqui tích mỡ cho mùa khô
  duration: 10
  visual: A tambaqui swims in a receding channel, fat from fruit eaten in the flooded
    forest.
  narration: Cá tambaqui tích mỡ cho mùa khô, hạt trong ruột nó tới khoảng 1 tuần
    đã gieo xong.
- id: s06
  title: Piranha dọn dẹp vũng cạn
  duration: 10
  visual: Piranhas feed on debris in a shrinking pool left behind by the retreating
    floodwater.
  narration: Cá piranha dài tới 30 cm dọn xác và quả rơi, làm sạch vũng nước trước
    khi khô.
- id: s07
  title: Várzea thấp khô dần
  duration: 10
  visual: A low várzea forest floor emerges from floodwater, muddy ground drying under
    the canopy.
  narration: Várzea thấp từng ngập 50 đến 230 ngày mỗi năm, nay khô dần chờ mưa trở
    lại.
- id: s08
  title: Cây igapó thở lại sau lũ
  duration: 10
  visual: Igapó trees stand in draining black water, their trunks and roots emerging
    after months submerged.
  narration: Cây igapó chìm trong nước tới 6 tháng, [âm nhạc] nay nước rút, cây thở
    lại trên nền rừng.
- id: s09
  title: Hạt igapó nảy mầm trên bùn
  duration: 10
  visual: A large igapó seed sprouts on wet mud as floodwater recedes from the forest
    floor.
  narration: Hạt cây igapó nặng trung bình 7,1 g, nằm lại trên bùn mới, nảy mầm khi
    nước rút.
- id: s10
  title: Hạt várzea trên phù sa mới
  duration: 10
  visual: Small várzea seeds germinate in fresh silt deposited by the retreating floodwater.
  narration: Hạt cây várzea chỉ nặng trung bình 1,2 g, trôi theo phù sa tới đất mới
    nay khô dần.
- id: s11
  title: Rừng ngập trung tâm lộ ra
  duration: 10
  visual: A vast flooded forest drains, channels narrowing and muddy paths reappearing
    between the trees.
  narration: Rừng ngập trung tâm rộng hơn 97.000 km2 đón nước rồi trả nước, để lại
    phù sa nuôi cây.
- id: s12
  title: Cây con chờ khoảng trống sáng
  duration: 10
  visual: A small seedling grows in dim shade on the exposed forest floor, waiting
    for a light gap.
  narration: Dưới ánh sáng chỉ 2 đến 5%, cây con chờ cây lớn đổ xuống mở khoảng trống
    sáng.
- id: s13
  title: Agouti đào hạt đã chôn
  duration: 10
  visual: An agouti digs up a buried Brazil nut seed on the drying forest floor.
  narration: Agouti chôn rải rác 65% hạt nó mở, trung bình 5,0 m, nay đào lại hạt
    dự trữ.
- id: s14
  title: Hạt bị quên thành cây mới
  duration: 10
  visual: A forgotten buried seed sprouts far from its parent tree on the receding
    floodplain edge.
  narration: Hạt được mang 0,5 đến 28,4 m tính từ gốc, hạt bị quên nảy mầm thành cây
    mới.
- id: s15
  title: Agouti sinh con trước mùa khô
  duration: 10
  visual: A female agouti with furry newborns forages on the drying forest floor.
  narration: Agouti mang thai 100 đến 120 ngày, mỗi lứa 1 đến 4 con, con non sinh
    ra đã có lông.
- id: s16
  title: Báo đốm rình bên vũng cạn
  duration: 10
  visual: A jaguar waits beside a shrinking pool, watching animals come to drink as
    water recedes.
  narration: Báo đốm nặng tới 250 pound [âm nhạc] rình bên vũng cạn, nơi thú tụ về
    uống khi nước rút.
- id: s17
  title: Báo đốm mẹ dẫn con theo nước rút
  duration: 10
  visual: A mother jaguar leads her cub along a drying riverbank toward a remaining
    pool.
  narration: Báo đốm mẹ dẫn con tới nước còn lại, con ở với mẹ tới khoảng 2 năm.
- id: s18
  title: Anaconda cuộn trong bùn ẩm
  duration: 10
  visual: A large green anaconda coils in wet mud beside a shrinking pool, waiting
    for prey.
  narration: Trăn anaconda dài tới 9 m, nặng hơn 250 kg, cuộn trong bùn ẩm chờ mồi
    khi vũng cạn.
- id: s19
  title: Lười trở lại tán cao
  duration: 10
  visual: A three-toed sloth climbs slowly back into the high canopy as floodwater
    drains below.
  narration: Lười dài 50 đến 70 cm, ăn lá chậm trên tán, trở lại đời sống trên cao
    sau lũ.
- id: s20
  title: Lười xuống đất mỗi tuần một lần
  duration: 10
  visual: A sloth climbs down a trunk to the exposed forest floor, pausing cautiously
    in dappled light.
  narration: Lười xuống đất khoảng 1 lần mỗi tuần, lúc dễ bị săn nhất khi nền rừng
    lộ ra.
- id: s21
  title: Đàn macaw về tán khô
  duration: 10
  visual: A flock of scarlet macaws flies over the draining forest, calling loudly
    to stay together.
  narration: Đàn vẹt macaw đỏ 10 đến 30 con bay về tán khô, giữ nhau bằng tiếng kêu
    lớn.
- id: s22
  title: Vẹt ăn đất sét sau mùa quả
  duration: 10
  visual: Macaws eat clay at a riverbank exposed by receding water, replenishing minerals
    after fruit season.
  narration: Vẹt tìm đất sét chứa natri gấp 40 lần thức ăn thực vật, bù thiếu hụt
    sau mùa quả.
- id: s23
  title: Mười tám loài cùng ăn đất
  duration: 10
  visual: Many bird species feed together on a clay wall beside the receding river.
  narration: Có nơi tới 18 loài chim cùng lúc ăn đất sét, chen nhau trên vách sông
    nay lộ rõ.
- id: s24
  title: Si ra quả cứu đói mùa khô
  duration: 10
  visual: A strangler fig heavy with fruit feeds birds and mammals as other trees
    stop fruiting.
  narration: Trong ít nhất 150 loài si ở Amazon, quả si ra nhiều lần trong năm cứu
    đói thú rừng.
- id: s25
  title: Bảy mươi phần trăm loài ăn si
  duration: 10
  visual: Many animal species share fig fruit in one forest patch as the dry season
    approaches.
  narration: Trong một số khu rừng, tới khoảng 70% loài động vật được ghi nhận ăn
    si trong khẩu phần.
- id: s26
  title: Ong si chuyên hóa từng loài
  duration: 10
  visual: A tiny fig wasp enters a fig syconium, pollinating flowers hidden inside
    the fruit.
  narration: Chi Ficus có hơn 850 loài toàn cầu, mỗi loài si thường gắn với một loài
    ong si riêng.
- id: s27
  title: Kapok rụng lá đón mùa khô
  duration: 10
  visual: A tall kapok tree sheds its leaves as the dry season begins, its bare crown
    against the sky.
  narration: Cây kapok cao 30 đến 40 m [âm nhạc] rụng lá mùa khô, bớt thoát hơi, giữ
    nước qua mùa nắng.
- id: s28
  title: Rễ bạnh giữ cây trên đất nông
  duration: 10
  visual: Buttress roots spread around a kapok trunk on the drying forest floor, anchoring
    the tall tree.
  narration: Rễ bạnh kapok lan tới 9 m, giữ cây đứng vững trên đất nông khi nước rút.
- id: s29
  title: Thân kapok chu vi hơn mười mét
  duration: 10
  visual: A massive kapok trunk with orchids growing on its branches towers over the
    drying canopy.
  narration: Thân kapok có chu vi hơn 10 m ở cây lớn, tán vượt là nhà của phong lan
    và chim.
- id: s30
  title: Lá súng che cá con trong vũng còn
  duration: 10
  visual: A giant Victoria leaf shades fish fry in a calm pool left by the receding
    flood.
  narration: Lá súng Victoria rộng tới 3 m che mặt nước còn lại, giữ bóng râm cho
    cá con.
- id: s31
  title: Hoa súng nhốt bọ hai đêm
  duration: 10
  visual: A white Victoria flower opens at night, trapping beetles inside until it
    turns pink the next night.
  narration: Hoa súng rộng tới 40 cm chỉ sống khoảng 48 giờ, nhốt bọ thụ phấn rồi
    thả đi.
- id: s32
  title: Cuống súng hạ theo nước rút
  duration: 10
  visual: A Victoria leaf lowers on its long stalk as the water level falls around
    it.
  narration: Cuống súng dài 7 đến 8 m hạ lá theo nước rút, không để lá mắc cạn khô.
- id: s33
  title: Tầng tán chính giữ ẩm khi khô
  duration: 10
  visual: Sunlight filters through the main canopy onto the drying understory, shade
    holding moisture below.
  narration: Tầng tán chính cao 20 đến 40 m che nắng, giữ ẩm cho tầng dưới khi mùa
    khô tới.
- id: s34
  title: Cây vượt tán rễ nông giữ cây
  duration: 10
  visual: Tall emergent trees stand above the canopy, their shallow roots gripping
    the drying soil.
  narration: Cây vượt tán cao 40 đến 80 m, rễ nông giữ cây đứng vững khi đất khô dần.
- id: s35
  title: Người ven sông theo mực nước
  duration: 10
  visual: Ribeirinho fishermen mend nets beside a receding river, following the falling
    water level.
  narration: Hơn 30 triệu người sống trong lưu vực, người ribeirinho đánh cá theo
    mực nước rút.
- id: s36
  title: Cây hạt Brazil trên terra firme
  duration: 10
  visual: A towering Brazil nut tree stands on high dry terra firme ground above the
    floodplain.
  narration: Trên đất cao terra firme không ngập theo mùa, cây hạt Brazil cao tới
    50 m chờ mùa sau.
- id: s37
  title: Ong lớn mở hoa hạt Brazil
  duration: 10
  visual: A large wild bee lifts the hooded petal of a Brazil nut flower high in the
    canopy.
  narration: Chỉ ong lớn mới thụ phấn được hoa cây, quả cần 14 tháng mới chín thành
    nang cứng.
- id: s38
  title: Quả nặng chìm như đá
  duration: 10
  visual: A heavy Brazil nut fruit drops to the forest floor and sinks into leaf litter,
    unable to float away.
  narration: Quả nặng 2 kg chìm như đá, không trôi theo nước, nên cây phải nhờ thú
    mang hạt.
- id: s39
  title: Cây sống hàng trăm năm
  duration: 10
  visual: A centuries-old Brazil nut giant towers over the canopy, its crown catching
    sunlight above younger trees.
  narration: Cây sống 500 năm trở lên, có nguồn ghi tới 1.000 năm, nhờ hai loài nhỏ
    mở hoa và quả.
- id: s40
  title: Rừng tự tạo mưa cho mình
  duration: 10
  visual: Mist rises from the wet canopy at dawn, forming clouds above the draining
    forest.
  narration: Rừng tự tạo 30 đến 50% lượng mưa của chính nó, [âm nhạc] mưa nuôi cây,
    cây lại ra quả.
- id: s41
  title: Mùa khô rừng vẫn tự làm mưa
  duration: 10
  visual: Vapour rises from dry-season canopy, clouds forming over the forest despite
    the falling river.
  narration: Một nghiên cứu mùa khô cho thấy tới 70% mưa mùa khô từ độ ẩm rừng tái
    chế theo địa điểm.
- id: s42
  title: Tán thoát hơi nuôi mây
  duration: 10
  visual: Water vapour rises from sunlit leaves, drifting upward to form clouds over
    the forest.
  narration: Mỗi m2 tán thoát 4 đến 4,5 lít nước mỗi ngày, tự nuôi mây cho mùa sau.
- id: s43
  title: Rễ hút nước từ đất mặt
  duration: 10
  visual: Rain soaks into the topsoil beneath the canopy, roots drawing moisture to
    feed transpiration.
  narration: Nghiên cứu mới cho thấy phần lớn nước thoát hơi đến từ 50 cm đất mặt,
    tùy địa điểm.
- id: s44
  title: Sông bay mang hơi nước đi xa
  duration: 10
  visual: Invisible moisture streams southward above the forest, clouds forming over
    distant wetlands.
  narration: Khoảng 40 đến 50% độ ẩm do Amazon tạo ra được đưa khỏi nơi nó bốc lên.
- id: s45
  title: Sông bay tưới Pantanal
  duration: 10
  visual: Clouds gather over the Pantanal wetlands, fed by invisible moisture carried
    from the Amazon forest.
  narration: Sông bay góp khoảng 50% lượng mưa cho vùng Pantanal, rừng nuôi mưa nơi
    xa.
- id: s46
  title: Hơi nước tới São Paulo
  duration: 10
  visual: Clouds drift over a distant city skyline, moisture carried thousands of
    kilometres from the forest.
  narration: Khoảng 15% lượng mưa ở São Paulo được cho là phụ thuộc hơi nước từ Amazon.
- id: s47
  title: Rừng trữ carbon khổng lồ
  duration: 10
  visual: A vast canopy stretches to the horizon, sunlight catching millions of leaves
    storing carbon.
  narration: Cây trong rừng trữ khoảng 650 tỷ tấn CO2, một kho carbon sống của hành
    tinh.
- id: s48
  title: Rừng hấp thụ carbon mỗi năm
  duration: 10
  visual: Leaves photosynthesize in bright canopy light, drawing carbon from the air
    into growing wood.
  narration: Rừng hấp thụ khoảng 2 đến 2,4 tỷ tấn CO2 mỗi năm, tùy nguồn tính toán
    khác nhau.
- id: s49
  title: Hai đơn vị carbon không cộng trực tiếp
  duration: 10
  visual: Scientists measure carbon stocks in a forest plot, comparing different calculation
    methods.
  narration: Cách tính khác ghi 150 đến 200 tỷ tấn carbon, đơn vị carbon và CO2 không
    cộng trực tiếp.
- id: s50
  title: Không phải lá phổi đơn giản
  duration: 10
  visual: A dense canopy breathes in sunlight, its oxygen largely consumed by the
    forest ecosystem itself.
  narration: Rừng có khoảng 390 tỷ cây, nhưng phần lớn oxy rừng tạo lại được chính
    hệ sinh thái tiêu thụ.
- id: s51
  title: Mười bảy phần trăm rừng đã mất
  duration: 10
  visual: A cleared patch scars the forest edge, degraded trees standing beside intact
    canopy.
  narration: Đánh giá năm 2023 ghi khoảng 17% rừng đã mất và khoảng 17% rừng bị suy
    thoái.
- id: s52
  title: Chăn nuôi phá rừng ở Brazil
  duration: 10
  visual: Cattle graze on cleared land at the forest edge, where rainforest once stood.
  narration: Chăn nuôi được báo cáo chiếm khoảng 80% nguyên nhân phá rừng ở Brazil.
- id: s53
  title: Mất rừng thấp nhất từ năm 2014
  duration: 10
  visual: A satellite view shows a smaller deforested patch in Brazil, intact forest
    surrounding it.
  narration: PRODES ghi mất rừng 5.796 km2 năm 2024 đến 2025, thấp nhất từ năm 2014.
- id: s54
  title: Giảm so với đỉnh phá rừng
  duration: 10
  visual: A chart of falling deforestation bars overlays a recovering forest landscape.
  narration: Con số ấy giảm 63% so với đỉnh 13.235 km2 năm 2020 đến 2021, nhưng chưa
    phải đã an toàn.
- id: s55
  title: Tích lũy mất rừng từ năm 1988
  duration: 10
  visual: A wide cleared corridor cuts through rainforest, stretching far beyond the
    horizon.
  narration: Mất rừng tích lũy từ năm 1988 khoảng 830.000 km2, lớn hơn Pháp cộng với
    Anh.
- id: s56
  title: Tháng năm mất rừng tăng mạnh
  duration: 10
  visual: Freshly cleared trees lie at a forest edge in May, smoke rising in the distance.
  narration: Tháng 5 năm 2025 mất 960 km2, tăng 92% so với tháng 5 năm 2024.
- id: s57
  title: Ngưỡng chuyển đổi hệ sinh thái
  duration: 10
  visual: A forest edge dries under harsh sun, savanna grasses creeping into the thinning
    canopy.
  narration: Ngưỡng thường trích là 20 đến 25% mất rừng, [âm nhạc] nghiên cứu mới
    nêu 22 đến 28% kèm nóng lên.
- id: s58
  title: Kịch bản lưu vực không còn cây
  duration: 10
  visual: A dry, treeless plain stretches where forest once stood, under a hazy sky.
  narration: WWF đặt kịch bản 27% lưu vực không còn cây vào năm 2030 nếu tốc độ lúc
    đó tiếp diễn.
- id: s59
  title: Cháy rừng thải carbon khổng lồ
  duration: 10
  visual: Wildfire smoke rises over burning forest, flames consuming trees at the
    dry-season edge.
  narration: Cháy rừng năm 2024 ước thải khoảng 791 triệu tấn CO2, mùa khô sắp trở
    lại khép vòng.
- id: s60
  title: Vòng tròn một năm khép lại
  duration: 10
  visual: The camera pulls back over the vast Amazon forest at sunset, river winding
    through endless canopy.
  narration: Không phải cây, cá hay thú riêng lẻ cứu rừng, mà là sự phụ thuộc của
    cả hệ sinh thái. Cảm ơn bạn, hãy đăng ký kênh.
